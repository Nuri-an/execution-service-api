services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: execution
      POSTGRES_PASSWORD: execution123
      POSTGRES_DB: execution_db
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execution -d execution_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  execution-service:
    build: .
    ports: ["3002:3002"]
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://execution:execution123@postgres:5432/execution_db?schema=public
      MONGODB_URI: mongodb://mongo:27017/execution_logs
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_RETRY_DELAY_MS: 3000
      RABBITMQ_MAX_RETRIES: 10
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
